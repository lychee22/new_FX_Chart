  # HTTP 价源配置 (当 price-source: http 时生效)
  # 对接真实价源时填入:
  http:
    base-url: ""                          # 如 https://api.example.com/v1
    api-key: ""                           # API Key
    bars-path: /candles/{symbol}?interval={interval}&count={count}

# Springdoc / Swagger UI 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs
  packages-to-scan: com.prosticks.chart.controller

logging:
  level:
    com.prosticks.chart: INFO
