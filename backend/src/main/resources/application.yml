server:
  # 2026-07-22 11:59:52：Linux 部署时后端仅供同机前端代理访问，不直接暴露到公网。
  address: 127.0.0.1
  port: 23723

spring:
  application:
    name: prosticks-chart-backend

# ====== Prosticks 价源配置 ======
prosticks:
  # 价源选择: sample(模拟数据,默认) / http(HTTP REST 价源)
  # 对接真实价源时改成 http, 并在下方 http 配置块填入真实信息
  price-source: sample

  # 2026-07-21 22:36:02：实时参数只在后端维护，前端连接后会收到实际生效值。
  realtime:
    enabled: true
    tick-interval-ms: 100
    bar-push-interval-ms: 500
    indicator-push-interval-ms: 1000
    heartbeat-interval-ms: 10000
    history-count: 300

  # 品种列表 (34个外汇/贵金属, 从配置加载)
